name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

jobs:
  validate:
    name: validate
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update Homebrew
        run: brew update-if-needed

      - name: Show environment
        run: |
          sw_vers
          uname -m
          brew --version

      - name: Validate metadata
        shell: bash
        run: |
          ruby <<'RUBY'
          require "yaml"
          require "uri"
          require "set"

          file = "packages.yml"
          abort "Missing #{file}" unless File.file?(file)

          data = YAML.safe_load(File.read(file), aliases: false)
          abort "packages.yml must contain a mapping" unless data.is_a?(Hash)
          abort "Unsupported schema: #{data["schema"].inspect}" unless data["schema"] == 1

          packages = data["packages"]
          abort "packages must be a non-empty array" unless packages.is_a?(Array) && !packages.empty?

          names = Set.new
          allowed_types = %w[cask formula].freeze
          allowed_upstreams = %w[github gitlab website git].freeze
          allowed_gatekeeper_context_statuses = %w[wontfix not_planned open context].freeze

          packages.each_with_index do |package, index|
            label = "packages[#{index}]"
            abort "#{label} must be a mapping" unless package.is_a?(Hash)

            name = package["name"]
            type = package["type"]

            abort "#{label}.name is required" unless name.is_a?(String) && name.match?(/\A[a-z0-9][a-z0-9@+._-]*\z/)
            abort "Duplicate package name: #{name}" unless names.add?(name)
            abort "#{name}: invalid type #{type.inspect}" unless allowed_types.include?(type)

            recipe = type == "cask" ? "Casks/#{name}.rb" : "Formula/#{name}.rb"
            abort "#{name}: missing recipe #{recipe}" unless File.file?(recipe)

            upstream = package["upstream"]
            abort "#{name}: upstream must be a mapping" unless upstream.is_a?(Hash)

            upstream_type = upstream["type"]
            upstream_url = upstream["url"]

            abort "#{name}: unsupported upstream type #{upstream_type.inspect}" unless allowed_upstreams.include?(upstream_type)
            abort "#{name}: upstream.url is required" unless upstream_url.is_a?(String)

            begin
              uri = URI.parse(upstream_url)
            rescue URI::InvalidURIError => e
              abort "#{name}: invalid upstream URL: #{e.message}"
            end

            abort "#{name}: upstream URL must use HTTPS" unless uri.scheme == "https"
            abort "#{name}: upstream URL must have a hostname" if uri.host.nil? || uri.host.empty?

            if upstream_type == "github"
              abort "#{name}: github upstream must use github.com" unless uri.host.downcase == "github.com"
              repo_path = uri.path.sub(%r{\A/}, "").sub(%r{/\z}, "")
              abort "#{name}: github URL must identify owner/repository" unless repo_path.split("/").length >= 2
            end

            origin = package["origin"]
            abort "#{name}: origin must be a mapping" unless origin.is_a?(Hash)
            abort "#{name}: origin.tap is required" unless origin["tap"].is_a?(String) && !origin["tap"].empty?
            abort "#{name}: origin.commit must be a 40-character Git SHA" unless origin["commit"].is_a?(String) && origin["commit"].match?(/\A[0-9a-f]{40}\z/)

            update = package["update"]
            abort "#{name}: update must be a mapping" unless update.is_a?(Hash)
            abort "#{name}: update.enabled must be boolean" unless [true, false].include?(update["enabled"])

            release_url_template = update["release_url_template"]
            if release_url_template
              abort "#{name}: update.release_url_template is only valid when automatic updates are disabled" if update["enabled"]
              abort "#{name}: update.release_url_template must be a string" unless release_url_template.is_a?(String)
              abort "#{name}: update.release_url_template must contain exactly one {version} placeholder" unless release_url_template.scan("{version}").length == 1

              begin
                release_uri = URI.parse(release_url_template.sub("{version}", "1.0.0"))
              rescue URI::InvalidURIError => e
                abort "#{name}: invalid update.release_url_template: #{e.message}"
              end

              abort "#{name}: update.release_url_template must use HTTPS" unless release_uri.scheme == "https"
              abort "#{name}: update.release_url_template must have a hostname" if release_uri.host.nil? || release_uri.host.empty?
            end

            gatekeeper = package["gatekeeper"]
            if gatekeeper
              abort "#{name}: gatekeeper must be a mapping" unless gatekeeper.is_a?(Hash)
              abort "#{name}: gatekeeper.dequarantine must be boolean" unless [true, false].include?(gatekeeper["dequarantine"])
              abort "#{name}: gatekeeper metadata is only valid for casks" unless type == "cask"

              upstream_context = gatekeeper["upstream_context"]
              if upstream_context
                unless upstream_context.is_a?(Array) && !upstream_context.empty?
                  abort "#{name}: gatekeeper.upstream_context must be a non-empty array"
                end

                upstream_context.each_with_index do |entry, context_index|
                  context_label = "#{name}: gatekeeper.upstream_context[#{context_index}]"
                  abort "#{context_label} must be a mapping" unless entry.is_a?(Hash)

                  context_url = entry["url"]
                  status = entry["status"]

                  abort "#{context_label}.url is required" unless context_url.is_a?(String)

                  begin
                    context_uri = URI.parse(context_url)
                  rescue URI::InvalidURIError => e
                    abort "#{context_label}.url is invalid: #{e.message}"
                  end

                  abort "#{context_label}.url must use HTTPS" unless context_uri.scheme == "https"
                  abort "#{context_label}.url must have a hostname" if context_uri.host.nil? || context_uri.host.empty?
                  abort "#{context_label}.status must be one of #{allowed_gatekeeper_context_statuses.join(", ")}" unless allowed_gatekeeper_context_statuses.include?(status)
                end
              end

              if gatekeeper["dequarantine"]
                source = File.read(recipe)
                unless source.include?("/usr/bin/xattr") && source.include?("com.apple.quarantine")
                  abort "#{name}: dequarantine is enabled in metadata but the cask has no matching xattr handling"
                end
              end
            end
          end

          puts "Metadata OK: #{packages.length} package(s)"
          RUBY

      - name: Validate generated README package table
        shell: bash
        run: |
          ruby scripts/update-readme-packages.rb

          if ! git diff --quiet -- README.md; then
            echo "::error::README package table is out of date. Run scripts/update-readme-packages.rb and commit README.md."
            git diff -- README.md
            exit 1
          fi

          echo "README package table is up to date."

      - name: Validate upstream provenance
        shell: bash
        run: |
          ruby <<'RUBY'
          require "yaml"
          require "uri"

          data = YAML.safe_load(File.read("packages.yml"), aliases: false)

          data.fetch("packages").each do |package|
            name = package.fetch("name")
            type = package.fetch("type")
            upstream = package.fetch("upstream")
            uri = URI.parse(upstream.fetch("url"))
            recipe = type == "cask" ? "Casks/#{name}.rb" : "Formula/#{name}.rb"
            source = File.read(recipe)

            expected =
              if upstream.fetch("type") == "github"
                path = uri.path.sub(%r{\A/}, "").sub(%r{/\z}, "")
                "github.com/#{path}/"
              else
                uri.host
              end

            abort "#{name}: recipe does not reference declared upstream #{expected}" unless source.include?(expected)

            puts "#{name}: upstream provenance OK (#{expected})"
          end
          RUBY

      - name: Tap checked-out repository
        shell: bash
        run: |
          brew tap fabiocaseri/unsigned "file://${GITHUB_WORKSPACE}"

      - name: Homebrew style
        shell: bash
        run: |
          ruby -ryaml -e '
            YAML.safe_load(File.read("packages.yml"), aliases: false).fetch("packages").each do |p|
              path = p.fetch("type") == "cask" ? "Casks/#{p.fetch("name")}.rb" : "Formula/#{p.fetch("name")}.rb"
              system("brew", "style", path) or exit 1
            end
          '

      - name: Homebrew audit
        shell: bash
        run: |
          while IFS=$'\t' read -r name type; do
            fq="fabiocaseri/unsigned/${name}"

            if [[ "${type}" == "cask" ]]; then
              brew trust --cask "${fq}"
              brew audit --cask --strict "${fq}"
            else
              brew trust --formula "${fq}"
              brew audit --formula --strict "${fq}"
            fi
          done < <(
            ruby -ryaml -e '
              YAML.safe_load(File.read("packages.yml"), aliases: false).fetch("packages").each do |p|
                puts [p.fetch("name"), p.fetch("type")].join("\t")
              end
            '
          )

      - name: Homebrew livecheck
        shell: bash
        run: |
          ruby -ryaml -e '
            YAML.safe_load(File.read("packages.yml"), aliases: false).fetch("packages").each do |p|
              fq = "fabiocaseri/unsigned/#{p.fetch("name")}"
              system("brew", "livecheck", fq) or exit 1
            end
          '

  security:
    name: security
    runs-on: macos-15
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update Homebrew
        run: brew update-if-needed

      - name: Tap checked-out repository
        shell: bash
        run: |
          brew tap fabiocaseri/unsigned "file://${GITHUB_WORKSPACE}"

      - name: Install and inspect Gatekeeper casks
        shell: bash
        run: |
          while IFS=$'\t' read -r name dequarantine; do
            fq="fabiocaseri/unsigned/${name}"

            echo "::group::${name}"
            brew trust --cask "${fq}"
            brew install --cask "${fq}"

            targets_found=0

            while IFS=$'\t' read -r artifact_type target; do
              [[ -n "${artifact_type}" && -n "${target}" ]] || continue
              targets_found=$((targets_found + 1))

              case "${artifact_type}" in
                app)
                  if [[ ! -d "${target}" ]]; then
                    echo "::error::${name}: expected app not found at ${target}"
                    exit 1
                  fi
                  ;;
                binary)
                  if [[ ! -x "${target}" ]]; then
                    echo "::error::${name}: expected executable binary not found at ${target}"
                    exit 1
                  fi
                  ;;
                *)
                  echo "::error::${name}: unsupported executable artifact type ${artifact_type}"
                  exit 1
                  ;;
              esac

              echo "Artifact type: ${artifact_type}"
              echo "Target: ${target}"
              echo "Code signing:"
              codesign -dv --verbose=4 "${target}" 2>&1 || true

              echo "Gatekeeper:"
              set +e
              gatekeeper_output="$(spctl --assess --type execute --verbose=4 "${target}" 2>&1)"
              gatekeeper_rc=$?
              set -e
              printf '%s\n' "${gatekeeper_output}"

              if [[ "${gatekeeper_rc}" -eq 0 ]]; then
                echo "::warning::${name}: Gatekeeper now accepts ${target}. Check whether this package can return to official Homebrew."
              fi

              if [[ "${dequarantine}" == "true" ]]; then
                if xattr -p com.apple.quarantine "${target}" >/dev/null 2>&1; then
                  echo "::error::${name}: com.apple.quarantine is still present on ${target} after installation"
                  exit 1
                else
                  echo "Quarantine attribute: absent (expected)"
                fi
              fi
            done < <(
              brew info --json=v2 --cask "${fq}" |
                ruby -rjson -e '
                  data = JSON.parse(STDIN.read)

                  data.fetch("casks").first.fetch("artifacts").each do |artifact|
                    if artifact.key?("app") && artifact["target"]
                      puts ["app", artifact.fetch("target")].join("\t")
                    elsif artifact.key?("binary") && artifact["target"]
                      puts ["binary", artifact.fetch("target")].join("\t")
                    end
                  end
                '
            )

            if [[ "${targets_found}" -eq 0 ]]; then
              echo "::error::${name}: no executable app or binary artifact found in brew info JSON"
              exit 1
            fi

            brew uninstall --cask "${fq}"
            echo "::endgroup::"
          done < <(
            ruby -ryaml -e '
              YAML.safe_load(File.read("packages.yml"), aliases: false).fetch("packages").each do |p|
                next unless p.fetch("type") == "cask"
                gatekeeper = p["gatekeeper"]
                next unless gatekeeper
                puts [p.fetch("name"), gatekeeper.fetch("dequarantine")].join("\t")
              end
            '
          )
