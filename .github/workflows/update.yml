name: Update packages

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}

jobs:
  discover:
    name: discover
    runs-on: macos-15
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build package matrix
        id: matrix
        shell: bash
        run: |
          ruby <<'RUBY'
          require "json"
          require "yaml"

          data = YAML.safe_load(File.read("packages.yml"), aliases: false)
          packages = data.fetch("packages")
                         .map do |package|
                           {
                             "name" => package.fetch("name"),
                             "type" => package.fetch("type"),
                             "auto_update" => package.dig("update", "enabled") == true,
                             "release_url_template" => package.dig("update", "release_url_template"),
                           }
                         end

          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
            output.puts "packages=#{JSON.generate(packages)}"
          end

          puts "Monitored packages: #{packages.map { |p| p["name"] }.join(", ")}"
          RUBY

  update:
    name: update ${{ matrix.package.name }}
    needs: discover
    if: ${{ needs.discover.outputs.packages != '[]' }}
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update Homebrew
        run: brew update-if-needed

      - name: Tap checked-out repository
        shell: bash
        run: |
          brew tap fabiocaseri/unsigned "file://${GITHUB_WORKSPACE}"

      - name: Trust package
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package.name }}
          PACKAGE_TYPE: ${{ matrix.package.type }}
        run: |
          fq="fabiocaseri/unsigned/${PACKAGE_NAME}"

          if [[ "${PACKAGE_TYPE}" == "cask" ]]; then
            brew trust --cask "${fq}"
          else
            brew trust --formula "${fq}"
          fi

      - name: Check latest version
        id: livecheck
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package.name }}
          PACKAGE_TYPE: ${{ matrix.package.type }}
        run: |
          fq="fabiocaseri/unsigned/${PACKAGE_NAME}"

          if [[ "${PACKAGE_TYPE}" == "cask" ]]; then
            json="$(brew livecheck --json --cask "${fq}")"
          else
            json="$(brew livecheck --json --formula "${fq}")"
          fi

          printf '%s\n' "${json}"

          CURRENT="$(
            printf '%s' "${json}" |
              ruby -rjson -e 'data = JSON.parse(STDIN.read).first; puts data.fetch("version").fetch("current")'
          )"

          LATEST="$(
            printf '%s' "${json}" |
              ruby -rjson -e 'data = JSON.parse(STDIN.read).first; puts data.fetch("version").fetch("latest")'
          )"

          OUTDATED="$(
            printf '%s' "${json}" |
              ruby -rjson -e 'data = JSON.parse(STDIN.read).first; puts data.fetch("version").fetch("outdated")'
          )"

          {
            echo "current=${CURRENT}"
            echo "latest=${LATEST}"
            echo "outdated=${OUTDATED}"
          } >> "${GITHUB_OUTPUT}"

          if [[ "${OUTDATED}" != "true" ]]; then
            echo "${PACKAGE_NAME} is up to date (${CURRENT})."
          else
            echo "${PACKAGE_NAME}: ${CURRENT} -> ${LATEST}"
          fi

      - name: Notify manual update
        if: ${{ steps.livecheck.outputs.outdated == 'true' && matrix.package.auto_update != true }}
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package.name }}
          PACKAGE_TYPE: ${{ matrix.package.type }}
          CURRENT: ${{ steps.livecheck.outputs.current }}
          LATEST: ${{ steps.livecheck.outputs.latest }}
          RELEASE_URL_TEMPLATE: ${{ matrix.package.release_url_template }}
        run: |
          title="Update available: ${PACKAGE_NAME}"
          release_url=""

          if [[ -n "${RELEASE_URL_TEMPLATE}" ]]; then
            release_url="${RELEASE_URL_TEMPLATE/\{version\}/${LATEST}}"
          fi

          {
            echo "A newer upstream version was detected for \`${PACKAGE_NAME}\`, which is configured for manual updates."
            echo
            echo "- Type: \`${PACKAGE_TYPE}\`"
            echo "- Current version: \`${CURRENT}\`"
            echo "- Latest upstream version: \`${LATEST}\`"
            if [[ -n "${release_url}" ]]; then
              echo "- Upstream release: ${release_url}"
            fi
            echo "- Automatic recipe modification is disabled for this package."
            echo
            echo "Review the upstream release and update the recipe manually when appropriate."
          } > manual-update-issue.md

          existing_issue="$(
            gh issue list \
              --state open \
              --limit 100 \
              --json number,title |
              ISSUE_TITLE="${title}" ruby -rjson -e '
                title = ENV.fetch("ISSUE_TITLE")
                issue = JSON.parse(STDIN.read).find { |item| item.fetch("title") == title }
                puts issue.fetch("number") if issue
              '
          )"

          if [[ -n "${existing_issue}" ]]; then
            gh issue edit "${existing_issue}" \
              --title "${title}" \
              --body-file manual-update-issue.md

            echo "Updated existing manual-update issue #${existing_issue}."
          else
            issue_url="$(
              gh issue create \
                --title "${title}" \
                --body-file manual-update-issue.md
            )"

            echo "Created ${issue_url}"
          fi

      - name: Prepare update
        if: ${{ steps.livecheck.outputs.outdated == 'true' && matrix.package.auto_update == true }}
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package.name }}
          PACKAGE_TYPE: ${{ matrix.package.type }}
          LATEST: ${{ steps.livecheck.outputs.latest }}
        run: |
          fq="fabiocaseri/unsigned/${PACKAGE_NAME}"
          tap_dir="$(brew --repository fabiocaseri/unsigned)"

          if [[ "${PACKAGE_TYPE}" == "cask" ]]; then
            recipe="Casks/${PACKAGE_NAME}.rb"
            brew bump-cask-pr \
              --write-only \
              --version "${LATEST}" \
              "${fq}"
          else
            recipe="Formula/${PACKAGE_NAME}.rb"
            brew bump-formula-pr \
              --write-only \
              --version "${LATEST}" \
              "${fq}"
          fi

          if [[ ! -f "${tap_dir}/${recipe}" ]]; then
            echo "::error::Updated recipe not found at ${tap_dir}/${recipe}"
            exit 1
          fi

          cp "${tap_dir}/${recipe}" "${GITHUB_WORKSPACE}/${recipe}"

          changed_files="$(git diff --name-only)"

          if [[ "${changed_files}" != "${recipe}" ]]; then
            echo "::error::Automatic update changed unexpected files:"
            printf '%s\n' "${changed_files}"
            exit 1
          fi

          if git diff --quiet -- "${recipe}"; then
            echo "::error::Homebrew reported an update but did not modify ${recipe}"
            exit 1
          fi

          echo "Homebrew-generated diff:"
          git diff -- "${recipe}"

      - name: Validate automatic update diff
        if: ${{ steps.livecheck.outputs.outdated == 'true' && matrix.package.auto_update == true }}
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package.name }}
          PACKAGE_TYPE: ${{ matrix.package.type }}
        run: |
          if [[ "${PACKAGE_TYPE}" == "cask" ]]; then
            recipe="Casks/${PACKAGE_NAME}.rb"
          else
            recipe="Formula/${PACKAGE_NAME}.rb"
          fi

          ruby scripts/validate-update-diff.rb "${PACKAGE_TYPE}" "${recipe}"

      - name: Create update pull request
        if: ${{ steps.livecheck.outputs.outdated == 'true' && matrix.package.auto_update == true }}
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package.name }}
          PACKAGE_TYPE: ${{ matrix.package.type }}
          CURRENT: ${{ steps.livecheck.outputs.current }}
          LATEST: ${{ steps.livecheck.outputs.latest }}
          GH_TOKEN: ${{ secrets.HOMEBREW_UPDATE_TOKEN }}
        run: |
          safe_latest="$(printf '%s' "${LATEST}" | tr -cs 'A-Za-z0-9._-' '-')"
          branch="autobump/${PACKAGE_NAME}-${safe_latest}"

          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            existing_pr="$(
              gh pr list \
                --head "${branch}" \
                --state open \
                --json number,url \
                --jq '.[0].url // empty'
            )"

            if [[ -n "${existing_pr}" ]]; then
              echo "Update PR already exists: ${existing_pr}"
              exit 0
            fi

            echo "::error::Remote branch ${branch} already exists but has no open PR. Clean it up manually before retrying."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "${branch}"

          if [[ "${PACKAGE_TYPE}" == "cask" ]]; then
            git add "Casks/${PACKAGE_NAME}.rb"
          else
            git add "Formula/${PACKAGE_NAME}.rb"
          fi

          git commit -m "${PACKAGE_NAME}: update ${CURRENT} to ${LATEST}"

          gh auth setup-git
          git push -u origin "${branch}"

          cat > pr-body.md <<EOF
          Automated Homebrew update for \`${PACKAGE_NAME}\`.

          - Type: \`${PACKAGE_TYPE}\`
          - Current version: \`${CURRENT}\`
          - Latest upstream version: \`${LATEST}\`
          - Recipe update generated by Homebrew's official bump command.
          - Merge remains manual.
          EOF

          pr_url="$(
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "${PACKAGE_NAME}: update ${CURRENT} to ${LATEST}" \
              --body-file pr-body.md
          )"

          echo "Created ${pr_url}"
